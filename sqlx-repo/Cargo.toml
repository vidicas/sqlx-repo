[package]
name = "sqlx-repo"
version = "0.2.1"
edition = "2024"
authors.workspace = true
license.workspace = true
description = "repository pattern on top of sqlx"
readme.workspace = true
keywords = ["sqlx", "repository"]
repository = "https://github.com/vidicas/sqlx-repo"

[dependencies]
futures = "0.3"
sqlx-repo-macros = { path = "../sqlx-repo-macros", version = "0.5.1" }
serde_json = "1"
sqlx = { version = "0.9", features = ["chrono", "json", "mysql", "postgres", "runtime-tokio", "sqlite", "tls-rustls", "uuid"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
anyhow = "1"
tempfile = "3.20.0"
tokio = { version = "1", features = ["full"] }
